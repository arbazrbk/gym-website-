{% load static %}

<!-- ========== CHATBOT FLOATING WIDGET ========== -->
<style>
/* ---------- Floating Toggle Button ---------- */
.chatbot-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, #CDEA26, #9ab800);
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(205,234,38,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: transform .25s, box-shadow .25s;
}
.chatbot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 28px rgba(205,234,38,.6);
}
.chatbot-toggle .icon-chat,
.chatbot-toggle .icon-close {
    position: absolute;
    font-size: 28px;
    transition: opacity .3s, transform .3s;
}
.chatbot-toggle .icon-close {
    opacity: 0;
    transform: rotate(-90deg) scale(.6);
}
.chatbot-toggle.active .icon-chat {
    opacity: 0;
    transform: rotate(90deg) scale(.6);
}
.chatbot-toggle.active .icon-close {
    opacity: 1;
    transform: rotate(0) scale(1);
}

/* ---------- Pulse ring animation ---------- */
.chatbot-toggle::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(205,234,38,.35);
    animation: pulse-ring 2s ease-out infinite;
}
.chatbot-toggle.active::before { animation: none; opacity: 0; }

@keyframes pulse-ring {
    0%   { transform: scale(1);   opacity: .7; }
    100% { transform: scale(1.7); opacity: 0; }
}

/* ---------- Chat Container ---------- */
.chatbot-container {
    position: fixed;
    bottom: 105px;
    right: 30px;
    width: 380px;
    max-height: 520px;
    background: #1a1a2e;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    display: flex;
    flex-direction: column;
    z-index: 9999;
    overflow: hidden;
    transform: scale(.4) translateY(30px);
    opacity: 0;
    pointer-events: none;
    transform-origin: bottom right;
    transition: transform .35s cubic-bezier(.4,.0,.2,1), opacity .3s;
}
.chatbot-container.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: all;
}

/* ---------- Header ---------- */
.chatbot-header {
    background: linear-gradient(135deg, #16213e, #0f3460);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.chatbot-header .bot-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #CDEA26, #9ab800);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
}
.chatbot-header .header-info h4 {
    margin: 0;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
}
.chatbot-header .header-info p {
    margin: 0;
    color: #CDEA26;
    font-size: 12px;
}
.online-dot {
    width: 8px;
    height: 8px;
    background: #CDEA26;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    animation: blink-dot 1.4s infinite;
}
@keyframes blink-dot {
    0%, 100% { opacity: 1; }
    50%      { opacity: .3; }
}

/* ---------- Messages Area ---------- */
.chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 280px;
    max-height: 320px;
    background: #1a1a2e;
}
.chatbot-messages::-webkit-scrollbar { width: 5px; }
.chatbot-messages::-webkit-scrollbar-track { background: transparent; }
.chatbot-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

/* Bubble styles */
.msg {
    max-width: 82%;
    padding: 10px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: msg-pop .3s ease;
}
@keyframes msg-pop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}
.msg.bot {
    background: #16213e;
    color: #e0e0e0;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}
.msg.user {
    background: linear-gradient(135deg, #CDEA26, #b5d120);
    color: #111;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 500;
}

/* Typing indicator */
.typing-indicator {
    display: none;
    align-self: flex-start;
    padding: 10px 18px;
    background: #16213e;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
}
.typing-indicator span {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #CDEA26;
    border-radius: 50%;
    margin: 0 2px;
    animation: typing-bounce .6s infinite alternate;
}
.typing-indicator span:nth-child(2) { animation-delay: .2s; }
.typing-indicator span:nth-child(3) { animation-delay: .4s; }
@keyframes typing-bounce {
    to { transform: translateY(-6px); opacity: .4; }
}

/* ---------- Quick Actions ---------- */
.quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 10px;
    background: #1a1a2e;
}
.quick-btn {
    background: rgba(205,234,38,.12);
    border: 1px solid rgba(205,234,38,.3);
    color: #CDEA26;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .2s;
}
.quick-btn:hover {
    background: rgba(205,234,38,.25);
    border-color: #CDEA26;
}

/* ---------- Input Area ---------- */
.chatbot-input-area {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    background: #16213e;
    gap: 10px;
    border-top: 1px solid rgba(255,255,255,.06);
}
.chatbot-input-area input {
    flex: 1;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 25px;
    padding: 10px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
}
.chatbot-input-area input::placeholder { color: #666; }
.chatbot-input-area input:focus { border-color: #CDEA26; }

.chatbot-send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #CDEA26, #9ab800);
    color: #111;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s;
    flex-shrink: 0;
}
.chatbot-send-btn:hover { transform: scale(1.1); }

/* ---------- Mobile responsive ---------- */
@media (max-width: 480px) {
    .chatbot-container {
        width: calc(100vw - 20px);
        right: 10px;
        bottom: 90px;
        max-height: 70vh;
    }
    .chatbot-toggle {
        bottom: 18px;
        right: 18px;
        width: 54px;
        height: 54px;
    }
}
</style>

<!-- Floating Toggle Button -->
<button class="chatbot-toggle" id="chatbotToggle" title="Chat with us!">
    <span class="icon-chat">💬</span>
    <span class="icon-close">✕</span>
</button>

<!-- Chat Popup Container -->
<div class="chatbot-container" id="chatbotContainer">
    <!-- Header -->
    <div class="chatbot-header">
        <div class="bot-avatar">🏋️</div>
        <div class="header-info">
            <h4>GymPro Assistant</h4>
            <p><span class="online-dot"></span>Online — Ask me anything</p>
        </div>
    </div>

    <!-- Messages -->
    <div class="chatbot-messages" id="chatbotMessages">
        <div class="msg bot">
            Hey there! 💪 I'm your <strong>GymPro</strong> fitness assistant. Ask me about workouts, plans, nutrition or anything gym-related!
        </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="quick-actions" id="quickActions">
        <button class="quick-btn" data-msg="What programs do you offer?">🏋️ Programs</button>
        <button class="quick-btn" data-msg="Tell me about pricing plans">💰 Pricing</button>
        <button class="quick-btn" data-msg="How to lose weight?">🔥 Weight Loss</button>
        <button class="quick-btn" data-msg="How to gain muscle?">💪 Muscle Gain</button>
    </div>

    <!-- Input -->
    <div class="chatbot-input-area">
        <input type="text" id="chatbotInput" placeholder="Type your message..." autocomplete="off" />
        <button class="chatbot-send-btn" id="chatbotSend">➤</button>
    </div>
</div>

<script>
(function () {
    const toggle    = document.getElementById('chatbotToggle');
    const container = document.getElementById('chatbotContainer');
    const messages  = document.getElementById('chatbotMessages');
    const input     = document.getElementById('chatbotInput');
    const sendBtn   = document.getElementById('chatbotSend');
    const quickBtns = document.querySelectorAll('.quick-btn');

    // Toggle open / close
    toggle.addEventListener('click', () => {
        toggle.classList.toggle('active');
        container.classList.toggle('open');
        if (container.classList.contains('open')) {
            setTimeout(() => input.focus(), 350);
        }
    });

    // Append a message bubble
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = 'msg ' + sender;
        div.innerHTML = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    // Show / hide typing dots
    function showTyping() {
        let dots = document.getElementById('typingDots');
        if (!dots) {
            dots = document.createElement('div');
            dots.id = 'typingDots';
            dots.className = 'typing-indicator';
            dots.innerHTML = '<span></span><span></span><span></span>';
            messages.appendChild(dots);
        }
        dots.style.display = 'block';
        messages.scrollTop = messages.scrollHeight;
    }
    function hideTyping() {
        const dots = document.getElementById('typingDots');
        if (dots) dots.remove();
    }

    // Send message to backend
    async function sendMessage(text) {
        if (!text.trim()) return;
        addMessage(text, 'user');
        input.value = '';

        // Hide quick actions after first user message
        const qa = document.getElementById('quickActions');
        if (qa) qa.style.display = 'none';

        showTyping();

        try {
            const res = await fetch("{% url 'chatbot' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            hideTyping();
            addMessage(data.reply || "Sorry, I couldn't understand that.", 'bot');
        } catch (err) {
            hideTyping();
            addMessage("⚠️ Something went wrong. Please try again.", 'bot');
        }
    }

    // Events
    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage(input.value);
    });
    quickBtns.forEach(btn => {
        btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
    });
})();
</script>
